# =============================================================================
# 智能档案管理系统 — 基线 docker-compose（演示/测试，非上线）
# -----------------------------------------------------------------------------
# 一条命令得到完整可用系统 + 基线数据库：
#   ./deploy/baseline-start.sh up        # 构建并启动，等待基线就绪并校验
#   ./deploy/baseline-start.sh down      # 停止
#   ./deploy/baseline-start.sh reset     # 停止并删除数据卷（恢复初始基线）
#
# 基线从何而来：
#   1. postgres 首次启动（数据卷为空）时，docker-entrypoint-initdb.d 中的
#      00-create-extension.sh 创建 pg_trgm 扩展（V13 迁移依赖它）。
#   2. app 启动后，后端 Flyway 自动执行 V1~V30 迁移得到完整基线
#      （schema + 角色/字典/配置 + 演示档案/档案盒等种子数据）。
#   3. minio-init 一次性创建业务所需 bucket。
# 外部依赖（AI/ClamAV/短信）默认关闭，保证零配置开机即用。
# 如需启用某项，复制 deploy/.env.example 为 deploy/.env 并填入对应 token：
#   - AI（DeepSeek）：AI_ENABLED=true + DEEPSEEK_API_KEY=sk-xxx
#   - 病毒扫描：FILE_SCAN_ENABLED=true + CLAMAV_HOST=...
#   - 短信：       ALIYUN_SMS_ENABLED=true + ALIYUN_SMS_ACCESS_KEY/SECRET
# =============================================================================

name: archive-baseline

services:
  db:
    image: postgres:17-alpine
    container_name: archive-baseline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: archive_user
      POSTGRES_PASSWORD: archive_pass_2024
      POSTGRES_DB: archive_db
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - db_data:/var/lib/postgresql/data
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/00-create-extension.sh
        mode: 0555
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive_user -d archive_db"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - archive-net

  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: archive-baseline-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - archive-net

  # 一次性任务：创建业务 bucket
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: archive-baseline-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/archive-files --ignore-existing;
      mc mb local/archive-metadata --ignore-existing;
      mc mb local/system-files --ignore-existing;
      echo 'MinIO buckets created.';
      exit 0;
      "
    networks:
      - archive-net

  # 病毒扫描（ClamAV）：baseline 自带，扫描 app 上传的文件。
  # 复用 archive-clamav-data 卷，病毒库已缓存（首次启动仍需加载到内存，约 1 分钟）。
  clamav:
    image: clamav/clamav:1.4
    container_name: archive-baseline-clamav
    restart: unless-stopped
    environment:
      CLAMD_STARTUP_TIMEOUT: ${CLAMD_STARTUP_TIMEOUT:-1800}
      FRESHCLAM_CHECKS: ${FRESHCLAM_CHECKS:-24}
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 6m
    networks:
      - archive-net

  app:
    image: ghcr.io/gua7gua/intelligent-file-management-system:baseline
    container_name: archive-baseline-app
    restart: unless-stopped
    # 镜像由 .github/workflows/docker-build.yaml 推送到 GHCR 的 :baseline 标签，
    # 此处只拉取、不本地构建（baseline-start.sh up 会自动拉取）。
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # 使用 dev profile（含数据源/Flyway 配置），再以环境变量覆盖外部依赖开关
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: archive_db
      DB_USER: archive_user
      DB_PASSWORD: archive_pass_2024
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      # 外部依赖开关与 token：默认关闭/空，保证零配置可用；可在 deploy/.env 覆盖启用
      #   - AI（DeepSeek）：AI_ENABLED + DEEPSEEK_API_KEY
      #   - 病毒扫描（ClamAV）：FILE_SCAN_ENABLED + CLAMAV_HOST/PORT
      #   - 阿里云短信：ALIYUN_SMS_ENABLED + ALIYUN_SMS_ACCESS_KEY/SECRET
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      FILE_SCAN_ENABLED: ${FILE_SCAN_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      ALIYUN_SMS_ENABLED: ${ALIYUN_SMS_ENABLED:-false}
      ALIYUN_SMS_ACCESS_KEY: ${ALIYUN_SMS_ACCESS_KEY:-}
      ALIYUN_SMS_SECRET: ${ALIYUN_SMS_SECRET:-}
    ports:
      # 宿主端口由 deploy/.env 的 ARCHIVE_HOST_PORT 控制（默认 8081），容器内固定 80
      - "${ARCHIVE_HOST_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks:
      - archive-net

configs:
  # postgres 首次初始化时创建 pg_trgm 扩展（V13 的 gin_trgm_ops 索引依赖它）。
  # 使用 compose 内联 content，无需额外文件。
  pg_init:
    content: |
      #!/bin/sh
      set -e
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<-EOSQL
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
      EOSQL

volumes:
  db_data:
    name: archive-baseline-db-data
  minio_data:
    name: archive-baseline-minio-data
  clamav_data:
    name: archive-clamav-data

networks:
  archive-net:
    name: archive-baseline-net
    driver: bridge
