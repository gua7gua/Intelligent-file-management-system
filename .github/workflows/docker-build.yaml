name: Build and Push Multi-Arch Docker Images

# 本 workflow 专为构建 baseline 演示镜像而存在：
#   - 推送 develop 分支时自动构建，标签恒为 :baseline
#   - 也支持 workflow_dispatch 手动触发（同样产出 :baseline）
# 版本不再随 commit SHA / git tag 变化，baseline 即稳定可复现的演示镜像。
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare variables
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          # 版本恒为 baseline（本 workflow 不再产出 commit SHA / tag 镜像）
          VERSION="baseline"

          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
          echo "REPO_LC=${REPO_LC}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/${OWNER_LC}/${REPO_LC}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.OWNER_LC }}        # 使用小写后的 owner
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ github.event.repository.description }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

  manifest:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Prepare variables
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          VERSION="baseline"

          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
          echo "REPO_LC=${REPO_LC}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/${OWNER_LC}/${REPO_LC}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.OWNER_LC }}
          password: ${{ github.token }}

      - name: Create and push multi-arch manifest
        run: |
          IMAGE="${{ env.IMAGE }}"
          VERSION="${{ env.VERSION }}"

          echo "🚀 Creating multi-arch manifest for ${IMAGE}:${VERSION}"

          # 创建 baseline manifest
          docker manifest create ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64
          docker manifest push ${IMAGE}:${VERSION}

          # baseline 是本仓库唯一构建的镜像，同步更新 :latest 指向它
          docker manifest create ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-amd64
          docker manifest push ${IMAGE}:latest
          echo "✅ Also updated :latest"

          echo "🎉 Success!"
          echo "   Image: ${IMAGE}:${VERSION} (amd64)"
