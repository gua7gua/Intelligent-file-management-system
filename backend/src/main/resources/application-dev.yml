spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:archive_db}?stringtype=unspecified
    username: ${DB_USER:archive_user}
    password: ${DB_PASSWORD:archive_pass_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0"

logging:
  level:
    com.archive: DEBUG
    org.flywaydb: INFO

# 联调：dev profile 显式启用真实 AI（DeepSeek）与 ClamAV 病毒扫描；
# 短信保持关闭走 fallback 固定码 123456（见 application.yml aliyun.sms-auth.enabled）。
ai:
  enabled: true

file:
  scan:
    enabled: true
