<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘记密码页 - 智能档案管理系统</title>
  <link rel="stylesheet" href="../common/css/base.css">
  <link rel="stylesheet" href="../common/css/components.css">
  <link rel="stylesheet" href="../common/css/shell.css">
  <style>
    .reset-layout {
      display: grid;
      grid-template-columns: minmax(260px, .8fr) minmax(360px, 1.2fr);
      gap: 18px;
      align-items: start;
    }

    .step-list {
      display: grid;
      gap: 10px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .step-list li {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    @media (max-width: 900px) {
      .reset-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="public-shell">
    <nav class="public-nav" aria-label="公众门户导航">
      <a href="index.html">智能档案馆</a>
      <div class="links">
        <a href="index.html">公众首页</a>
        <a href="search.html">公开检索</a>
        <a href="register.html">注册</a>
        <a class="active" href="../login.html">登录</a>
      </div>
    </nav>

    <main class="public-content">
      <div class="reset-layout">
        <section class="card panel">
          <p class="status warning">公众账号找回</p>
          <h1 class="page-title" style="margin-top:12px;">重置公众账号密码</h1>
          <p class="page-subtitle">本页仅处理 `users.user_type = public` 的账号。内部账号请联系系统管理员重置。</p>
          <ol class="step-list">
            <li><strong>1. 校验手机号</strong><br><span class="muted">确认手机号属于有效公众账号。</span></li>
            <li><strong>2. 验证短信码</strong><br><span class="muted">验证码校验通过后允许设置新密码。</span></li>
            <li><strong>3. 重新登录</strong><br><span class="muted">重置成功后回到统一登录页。</span></li>
          </ol>
        </section>

        <section class="card panel">
          <h2 class="section-title">找回密码</h2>
          <form id="resetForm" class="grid" style="gap:13px;">
            <div class="form-grid" style="grid-template-columns:1fr auto;">
              <div class="field">
                <label for="phone">公众账号手机号</label>
                <input id="phone" value="13800000001" inputmode="tel" required>
              </div>
              <div class="field">
                <label>&nbsp;</label>
                <button id="sendCode" class="button secondary" type="button">发送验证码</button>
              </div>
            </div>
            <div class="field">
              <label for="code">短信验证码</label>
              <input id="code" value="135790" inputmode="numeric" required>
            </div>
            <div class="form-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));">
              <div class="field">
                <label for="password">新密码</label>
                <input id="password" type="password" value="Public@2026" required>
              </div>
              <div class="field">
                <label for="confirmPassword">确认新密码</label>
                <input id="confirmPassword" type="password" value="Public@2026" required>
              </div>
            </div>
            <div class="actions">
              <button class="button" type="submit"><span class="icon">✓</span>确认重置</button>
              <a class="button ghost" href="../login.html">返回登录</a>
            </div>
          </form>
          <div id="result" style="margin-top:14px;" aria-live="polite"></div>
          <p class="hint">系统管理员、档案管理员、移交单位经办人、内部查阅者和馆领导账号不通过公众找回流程处理。</p>
        </section>
      </div>
    </main>
  </div>

  <script>
    document.querySelector("#sendCode").addEventListener("click", (event) => {
      event.currentTarget.textContent = "验证码已发送";
      event.currentTarget.disabled = true;
      document.querySelector("#result").innerHTML = '<div class="notice">验证码已发送。原型默认验证码为 135790。</div>';
    });

    document.querySelector("#resetForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const phone = document.querySelector("#phone").value.trim();
      const code = document.querySelector("#code").value.trim();
      const pwd = document.querySelector("#password").value;
      const confirm = document.querySelector("#confirmPassword").value;
      if (!/^1\\d{10}$/.test(phone)) {
        document.querySelector("#result").innerHTML = '<div class="notice danger">请输入有效的公众账号手机号。</div>';
        return;
      }
      if (!code || pwd !== confirm) {
        document.querySelector("#result").innerHTML = '<div class="notice danger">请填写验证码，并确认两次新密码一致。</div>';
        return;
      }
      document.querySelector("#result").innerHTML = '<div class="notice">密码已重置。请返回 <a href="../login.html"><strong>统一登录页</strong></a> 使用公众角色登录。</div>';
    });
  </script>
</body>
</html>
