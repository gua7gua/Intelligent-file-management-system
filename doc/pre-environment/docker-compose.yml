# =============================================================================
# 智能档案管理系统 — 开发环境 Docker Compose
# =============================================================================
# 启动: docker compose up -d
# 停止: docker compose down
# 清理数据: docker compose down -v   （会删除所有持久化数据！）
# =============================================================================

services:
  # ── PostgreSQL 17 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: archive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-archive_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-archive_pass_2024}
      POSTGRES_DB: ${DB_NAME:-archive_db}
      # 使用 scram-sha-256 认证方式
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # 数据库 locale
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次启动时自动执行初始化 SQL（仅在数据目录为空时执行）
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-archive_user} -d ${DB_NAME:-archive_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    shm_size: 128mb
    networks:
      - archive-net

  # ── MinIO 对象存储 ────────────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: archive-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      # 注意: 2024 年起使用 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
      # 旧版 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 已废弃
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      # MinIO 新版镜像不再包含 curl，使用内置 mc 命令
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - archive-net

  # ── MinIO Bucket 初始化（一次性任务）───────────────────────────────────────
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: archive-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb local/archive-files --ignore-existing;
      /usr/bin/mc mb local/archive-metadata --ignore-existing;
      /usr/bin/mc mb local/system-files --ignore-existing;
      echo 'MinIO buckets created successfully.';
      exit 0;
      "
    networks:
      - archive-net

  # ── ClamAV 病毒扫描 ───────────────────────────────────────────────────────
  clamav:
    image: clamav/clamav:1.4
    container_name: archive-clamav
    restart: unless-stopped
    environment:
      # 官方镜像默认同时启动 clamd 和 freshclam；首次加载病毒库可能较慢
      CLAMD_STARTUP_TIMEOUT: ${CLAMD_STARTUP_TIMEOUT:-1800}
      FRESHCLAM_CHECKS: ${FRESHCLAM_CHECKS:-24}
    ports:
      # clamd TCP 无鉴权/无加密；开发期仅绑定本机回环，供宿主机 Spring Boot 调用
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      # 持久化病毒库，避免每次重建容器都重新下载完整签名库
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 6m
    networks:
      - archive-net

volumes:
  postgres_data:
    name: archive-postgres-data
  minio_data:
    name: archive-minio-data
  clamav_data:
    name: archive-clamav-data

networks:
  archive-net:
    name: archive-net
    driver: bridge
